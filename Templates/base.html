<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Expense Tracker
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <nav>

        <div class="nav-container">

            <a
                href="{{ url_for('index') }}"
                class="logo"
            >
                Expense Tracker
            </a>

            <a
                href="{{ url_for('add_expense') }}"
                class="add-button"
            >
                + Add Expense
            </a>

        </div>

    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
