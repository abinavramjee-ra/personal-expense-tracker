{% extends "base.html" %}

{% block title %}
Add Expense
{% endblock %}


{% block content %}

<div class="form-container">

    <div class="card">

        <h1>
            Add Expense
        </h1>

        <form
            method="POST"
            class="expense-form"
        >

            <label>
                Amount
            </label>

            <input
                type="number"
                name="amount"
                step="0.01"
                min="0.01"
                placeholder="25.00"
                required
            >

            <label>
                Category
            </label>

            <input
                type="text"
                name="category"
                placeholder="Food"
                required
            >

            <label>
                Description
            </label>

            <input
                type="text"
                name="description"
                placeholder="Lunch"
                required
            >

            <label>
                Date
            </label>

            <input
                type="date"
                name="date"
                required
            >

            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-button"
                >
                    Save Expense
                </button>

                <a
                    href="{{ url_for('index') }}"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
